9999997" cy="323.79999999999995" r="6" fill="#7889bb" opacity=".45"/><circle cx="516.4000000000001" cy="306.4" r="6" fill="#7889bb" opacity=".45"/><circle cx="542.64" cy="309.3" r="6" fill="#7889bb" opacity=".45"/><circle cx="575.44" cy="289.0" r="6" fill="#7889bb" opacity=".45"/><circle cx="614.8000000000001" cy="297.7" r="6" fill="#7889bb" opacity=".45"/><circle cx="647.6" cy="268.7" r="6" fill="#7889bb" opacity=".45"/><circle cx="680.4" cy="280.3" r="6" fill="#7889bb" opacity=".45"/><circle cx="713.1999999999999" cy="245.5" r="6" fill="#7889bb" opacity=".45"/><line x1="411.44" x2="411.44" y1="428.2" y2="354.88800000000003" stroke="#0023ff" stroke-width="3" stroke-dasharray="6 5"/><circle cx="411.44" cy="354.88800000000003" r="7" fill="white" stroke="#8d9996" stroke-width="2"/><circle cx="411.44" cy="428.2" r="18" fill="#0023ff" opacity=".1"/><circle cx="411.44" cy="428.2" r="10" fill="#0023ff" stroke="white" stroke-width="2"/><text x="429.44" y="452.2" font-size="24" fill="#0023ff" font-weight="600" text-anchor="start">Below the line</text><line x1="582.0" x2="582.0" y1="236.8" y2="300.6" stroke="#a33e78" stroke-width="3" stroke-dasharray="6 5"/><circle cx="582.0" cy="300.6" r="7" fill="white" stroke="#8d9996" stroke-width="2"/><circle cx="582.0" cy="236.8" r="18" fill="#a33e78" opacity=".1"/><circle cx="582.0" cy="236.8" r="10" fill="#a33e78" stroke="white" stroke-width="2"/><text x="600.0" y="202.8" font-size="24" fill="#a33e78" font-weight="600" text-anchor="start">Above the line</text><text x="418" y="550" font-size="25" fill="#5c6766" font-weight="400" text-anchor="middle">volume/game (rb)</text><text x="30" y="347" transform="rotate(-90 30 347)" text-anchor="middle" font-size="23" fill="#5c6766">FANTASY PPR (PPG)</text><circle cx="830" cy="232" r="6" fill="#0023ff"/><text x="848" y="241" font-size="27" fill="#0023ff" font-weight="600" text-anchor="start">Positive potential</text><text x="826" y="280" font-size="24" fill="#5c6766" font-weight="400" text-anchor="start">Scoring below the line</text><text x="826" y="314" font-size="24" fill="#5c6766" font-weight="400" text-anchor="start">for the current index.</text><line x1="826" x2="1126" y1="342" y2="342" stroke="#dce1dc"/><circle cx="830" cy="379" r="6" fill="#a33e78"/><text x="848" y="388" font-size="27" fill="#a33e78" font-weight="600" text-anchor="start">Negative potential</text><text x="826" y="427" font-size="24" fill="#5c6766" font-weight="400" text-anchor="start">Scoring above the line</text><text x="826" y="461" font-size="24" fill="#5c6766" font-weight="400" text-anchor="start">for the current index.</text><text x="826" y="518" font-size="22" fill="#242b2b" font-weight="400" text-anchor="start">Potential = fitted − actual</text></g></svg>

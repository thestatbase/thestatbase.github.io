<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Running back potential: opportunity and production</title>
<desc id="desc">An illustrative scatterplot showing how player opportunity or volume compares with fantasy PPR scoring. Below the fitted line means positive potential; above it means negative potential. Potential describes a current scoring gap to evaluate in future games. These dots represent a concept, not actual players.</desc>
<rect width="1200" height="630" fill="white"/>
<g font-family="Arial,Helvetica,sans-serif">

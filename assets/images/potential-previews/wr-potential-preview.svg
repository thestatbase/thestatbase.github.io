7889bb" opacity=".45" /><circle cx="538.05" cy="303.59" r="6" fill="#7889bb" opacity=".45" /><circle cx="567.24" cy="318.30" r="6" fill="#7889bb" opacity=".45" /><circle cx="596.43" cy="289.01" r="6" fill="#7889bb" opacity=".45" /><circle cx="625.62" cy="307.71" r="6" fill="#7889bb" opacity=".45" /><circle cx="654.82" cy="271.42" r="6" fill="#7889bb" opacity=".45" /><circle cx="684.01" cy="292.13" r="6" fill="#7889bb" opacity=".45" /><circle cx="713.20" cy="248.84" r="6" fill="#7889bb" opacity=".45" /><line x1="411.44" x2="411.44" y1="428.20" y2="354.89" stroke="#0023ff" stroke-width="3" stroke-dasharray="6 5" /><circle cx="411.44" cy="354.89" r="7" fill="white" stroke="#8d9996" stroke-width="2" /><circle cx="411.44" cy="428.2" r="18" fill="#0023ff" opacity=".1" /><circle cx="411.44" cy="428.2" r="10" fill="#0023ff" stroke="white" stroke-width="2" /><text x="429.44" y="452.2" font-size="24" fill="#0023ff" font-weight="600" text-anchor="start">Below the line</text><line x1="582.00" x2="582.00" y1="236.80" y2="300.60" stroke="#a33e78" stroke-width="3" stroke-dasharray="6 5" /><circle cx="582" cy="300.60" r="7" fill="white" stroke="#8d9996" stroke-width="2" /><circle cx="582" cy="236.8" r="18" fill="#a33e78" opacity=".1" /><circle cx="582" cy="236.8" r="10" fill="#a33e78" stroke="white" stroke-width="2" /><text x="600" y="212.8" font-size="24" fill="#a33e78" font-weight="600" text-anchor="start">Above the line</text><text x="418" y="550" font-size="25" fill="#5c6766" font-weight="400" text-anchor="middle">Estimated WOPR (×100)</text><text x="30" y="347" transform="rotate(-90 30 347)" text-anchor="middle" font-size="23" fill="#5c6766">FANTASY PPR (PPG)</text><circle cx="830" cy="232" r="6" fill="#0023ff" /><text x="848" y="241" font-size="27" fill="#0023ff" font-weight="600" text-anchor="start">Positive potential</text><text x="826" y="280" font-size="24" fill="#5c6766" font-weight="400" text-anchor="start">Scoring below the line</text><text x="826" y="314" font-size="24" fill="#5c6766" font-weight="400" text-anchor="start">for the current index.</text><line x1="826" x2="1126" y1="342" y2="342" stroke="#dce1dc" /><circle cx="830" cy="379" r="6" fill="#a33e78" /><text x="848" y="388" font-size="27" fill="#a33e78" font-weight="600" text-anchor="start">Negative potential</text><text x="826" y="427" font-size="24" fill="#5c6766" font-weight="400" text-anchor="start">Scoring above the line</text><text x="826" y="461" font-size="24" fill="#5c6766" font-weight="400" text-anchor="start">for the current index.</text><text x="826" y="518" font-size="22" fill="#242b2b" font-weight="400" text-anchor="start">Potential = fitted − actual</text><rect x="1080" y="91" width="74" height="44" rx="5" fill="#0023ff" /><text x="1117" y="121" text-anchor="middle" font-size="24" font-weight="700" fill="white">WR</text></g></svg>

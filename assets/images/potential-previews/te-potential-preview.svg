bb" opacity=".45" /><circle cx="529.20" cy="315.79" r="6" fill="#7889bb" opacity=".45" /><circle cx="557.00" cy="323.74" r="6" fill="#7889bb" opacity=".45" /><circle cx="584.80" cy="300.69" r="6" fill="#7889bb" opacity=".45" /><circle cx="612.60" cy="304.64" r="6" fill="#7889bb" opacity=".45" /><circle cx="640.40" cy="282.59" r="6" fill="#7889bb" opacity=".45" /><circle cx="668.20" cy="287.53" r="6" fill="#7889bb" opacity=".45" /><circle cx="696.00" cy="270.48" r="6" fill="#7889bb" opacity=".45" /><line x1="385.00" x2="385.00" y1="419.00" y2="364.56" stroke="#0023ff" stroke-width="3" stroke-dasharray="6 5" /><circle cx="385" cy="364.56" r="7" fill="white" stroke="#8d9996" stroke-width="2" /><circle cx="385" cy="419" r="18" fill="#0023ff" opacity=".1" /><circle cx="385" cy="419" r="10" fill="#0023ff" stroke="white" stroke-width="2" /><text x="403" y="443" font-size="24" fill="#0023ff" font-weight="600" text-anchor="start">Below the line</text><line x1="601.00" x2="601.00" y1="245.00" y2="302.00" stroke="#a33e78" stroke-width="3" stroke-dasharray="6 5" /><circle cx="601" cy="302.00" r="7" fill="white" stroke="#8d9996" stroke-width="2" /><circle cx="601" cy="245" r="18" fill="#a33e78" opacity=".1" /><circle cx="601" cy="245" r="10" fill="#a33e78" stroke="white" stroke-width="2" /><text x="619" y="221" font-size="24" fill="#a33e78" font-weight="600" text-anchor="start">Above the line</text><text x="418" y="550" font-size="25" fill="#5c6766" font-weight="400" text-anchor="middle">Estimated WOPR (×100)</text><text x="30" y="347" transform="rotate(-90 30 347)" text-anchor="middle" font-size="23" fill="#5c6766">FANTASY PPR (PPG)</text><circle cx="830" cy="232" r="6" fill="#0023ff" /><text x="848" y="241" font-size="27" fill="#0023ff" font-weight="600" text-anchor="start">Positive potential</text><text x="826" y="280" font-size="24" fill="#5c6766" font-weight="400" text-anchor="start">Scoring below the line</text><text x="826" y="314" font-size="24" fill="#5c6766" font-weight="400" text-anchor="start">for the current index.</text><line x1="826" x2="1126" y1="342" y2="342" stroke="#dce1dc" /><circle cx="830" cy="379" r="6" fill="#a33e78" /><text x="848" y="388" font-size="27" fill="#a33e78" font-weight="600" text-anchor="start">Negative potential</text><text x="826" y="427" font-size="24" fill="#5c6766" font-weight="400" text-anchor="start">Scoring above the line</text><text x="826" y="461" font-size="24" fill="#5c6766" font-weight="400" text-anchor="start">for the current index.</text><text x="826" y="518" font-size="22" fill="#242b2b" font-weight="400" text-anchor="start">Potential = fitted − actual</text><rect x="1080" y="91" width="74" height="44" rx="5" fill="#7833b8" /><text x="1117" y="121" text-anchor="middle" font-size="24" font-weight="700" fill="white">TE</text></g></svg>

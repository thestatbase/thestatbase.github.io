bb" opacity=".45" /><circle cx="543.05" cy="351.93" r="6" fill="#7889bb" opacity=".45" /><circle cx="562.24" cy="319.54" r="6" fill="#7889bb" opacity=".45" /><circle cx="601.43" cy="344.55" r="6" fill="#7889bb" opacity=".45" /><circle cx="620.62" cy="314.17" r="6" fill="#7889bb" opacity=".45" /><circle cx="659.82" cy="324.17" r="6" fill="#7889bb" opacity=".45" /><circle cx="679.01" cy="283.79" r="6" fill="#7889bb" opacity=".45" /><circle cx="718.20" cy="301.80" r="6" fill="#7889bb" opacity=".45" /><line x1="542.00" x2="542.00" y1="418.00" y2="343.22" stroke="#0023ff" stroke-width="3" stroke-dasharray="6 5" /><circle cx="542" cy="343.22" r="7" fill="white" stroke="#8d9996" stroke-width="2" /><circle cx="542" cy="418" r="18" fill="#0023ff" opacity=".1" /><circle cx="542" cy="418" r="10" fill="#0023ff" stroke="white" stroke-width="2" /><text x="560" y="442" font-size="24" fill="#0023ff" font-weight="600" text-anchor="start">Below the line</text><line x1="300.00" x2="300.00" y1="342.00" y2="411.10" stroke="#a33e78" stroke-width="3" stroke-dasharray="6 5" /><circle cx="300" cy="411.10" r="7" fill="white" stroke="#8d9996" stroke-width="2" /><circle cx="300" cy="342" r="18" fill="#a33e78" opacity=".1" /><circle cx="300" cy="342" r="10" fill="#a33e78" stroke="white" stroke-width="2" /><text x="318" y="318" font-size="24" fill="#a33e78" font-weight="600" text-anchor="start">Above the line</text><text x="418" y="550" font-size="25" fill="#5c6766" font-weight="400" text-anchor="middle">Volume / game</text><text x="30" y="347" transform="rotate(-90 30 347)" text-anchor="middle" font-size="23" fill="#5c6766">FANTASY PPR (PPG)</text><circle cx="830" cy="232" r="6" fill="#0023ff" /><text x="848" y="241" font-size="27" fill="#0023ff" font-weight="600" text-anchor="start">Positive potential</text><text x="826" y="280" font-size="24" fill="#5c6766" font-weight="400" text-anchor="start">Scoring below the line</text><text x="826" y="314" font-size="24" fill="#5c6766" font-weight="400" text-anchor="start">for the current index.</text><line x1="826" x2="1126" y1="342" y2="342" stroke="#dce1dc" /><circle cx="830" cy="379" r="6" fill="#a33e78" /><text x="848" y="388" font-size="27" fill="#a33e78" font-weight="600" text-anchor="start">Negative potential</text><text x="826" y="427" font-size="24" fill="#5c6766" font-weight="400" text-anchor="start">Scoring above the line</text><text x="826" y="461" font-size="24" fill="#5c6766" font-weight="400" text-anchor="start">for the current index.</text><text x="826" y="518" font-size="22" fill="#242b2b" font-weight="400" text-anchor="start">Potential = fitted − actual</text><rect x="1080" y="91" width="74" height="44" rx="5" fill="#006674" /><text x="1117" y="121" text-anchor="middle" font-size="24" font-weight="700" fill="white">RB</text></g></svg>

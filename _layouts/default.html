<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title | escape }} · The StatBase{% else %}The StatBase · Advanced Sports Analytics{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description | escape }}{% else %}Advanced analytics for professional and collegiate sports. NFL, NBA, and NCAA research by Drew Schmidt.{% endif %}">
  <meta name="theme-color" content="#fafaf7">
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% if page.potential_page %}<link rel="stylesheet" href="{{ '/assets/css/potential.css' | relative_url }}">{% endif %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="top-nav">
    <div class="nav-inner">
      <a href="{{ '/' | relative_url }}" class="nav-brand">The StatBase</a>
      <nav class="nav-links" id="navLinks" aria-label="Main">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active" aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/projects/' | relative_url }}"{% if page.url == '/projects/' %} class="active" aria-current="page"{% endif %}>Projects</a>
        <a href="mailto:dgschmidt00@icloud.com">Contact</a>
      </nav>
      <button class="nav-toggle" id="navToggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="navLinks"><span></span><span></span></button>
    </div>
  </header>
  <main class="site-main" id="main-content" tabindex="-1">{{ content }}</main>
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-left"><span class="footer-brand">The StatBase</span><span class="footer-tagline">Advanced Sports Analytics</span></div>
      <a href="mailto:dgschmidt00@icloud.com" class="footer-email">dgschmidt00@icloud.com</a>
    </div>
  </footer>
</body>
</html>
